  <text x="76" y="86" fill="#527363" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" font-weight="700" letter-spacing="2">CELLPINDA · 상품 구성 안내</text>
  <text x="74" y="198" fill="#18382b" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="50" font-weight="700">셀핀다 가바 1500</text>
  <text x="78" y="337" fill="#126a49" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="112" font-weight="750" letter-spacing="-5">1,500</text>
  <text x="464" y="336" fill="#527363" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="34" font-weight="650">mg / 한 포</text>
  <line x1="78" y1="376" x2="554" y2="376" stroke="#cbd9cd" stroke-width="2"/>
  <text x="80" y="435" fill="#18382b" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="31" font-weight="700">30포</text>
  <text x="220" y="435" fill="#607567" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="24">한 상자</text>
  <text x="80" y="492" fill="#18382b" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="31" font-weight="700">45 g</text>
  <text x="220" y="492" fill="#607567" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="24">전체 무게</text>
