<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="robots" content="noindex, nofollow" />
    <title>페이지를 찾을 수 없어요 | 셀핀다</title>
    <style>
      :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#18382b;background:#fff;font-synthesis:none}
      *{box-sizing:border-box}
      body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
      main{width:min(100%,640px);padding:clamp(28px,7vw,64px);border:1px solid #d9e5dc;border-radius:20px;background:linear-gradient(145deg,#fff 48%,#f1f6f1)}
      .brand{display:inline-block;margin-bottom:52px;font-size:20px;font-weight:750;letter-spacing:-.04em;text-decoration:none;color:#18382b}
      .brand span{color:#14764e}
      .eyebrow{margin:0 0 18px;color:#14764e;font-size:13px;letter-spacing:.1em}
      h1{margin:0;font-size:clamp(36px,8vw,56px);line-height:1.15;letter-spacing:-.06em}
      p{margin:20px 0 0;color:#53695c;font-size:17px;line-height:1.8}
      nav{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}
      .button{display:inline-flex;min-height:50px;align-items:center;justify-content:center;padding:12px 20px;border:1px solid #14764e;border-radius:999px;background:#14764e;color:#fff;font-size:15px;font-weight:650;text-decoration:none}
      .button.secondary{background:#fff;color:#18382b}
      a:focus-visible{outline:3px solid #8757b0;outline-offset:4px}
      @media(max-width:480px){body{padding:16px}main{border-radius:14px}.brand{margin-bottom:38px}nav{display:grid;grid-template-columns:1fr}.button{width:100%}}
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/cellpinda_GABA/">Cellpinda<span>.</span></a>
      <p class="eyebrow">PAGE NOT FOUND</p>
      <h1>페이지를<br />찾을 수 없어요.</h1>
      <p>주소가 바뀌었거나 링크가 잘못되었을 수 있어요. 첫 화면에서 필요한 내용을 다시 찾아보세요.</p>
      <nav aria-label="다음으로 이동">
        <a class="button" href="/cellpinda_GABA/">첫 화면으로</a>
        <a class="button secondary" href="/cellpinda_GABA/#rhythm">잠과 휴식 1분 체크</a>
      </nav>
    </main>
  </body>
</html>
