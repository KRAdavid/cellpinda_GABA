name: Daily Cellpinda GABA status report

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-status-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Sync approved public data
        run: node scripts/sync-public-data.mjs
      - name: Generate daily status report
        id: report
        continue-on-error: true
        env:
          PUBLIC_SITE_URL: https://kradavid.github.io/cellpinda_GABA
        run: node scripts/generate-daily-status-report.mjs --out daily-status.json
      - name: Upload daily status artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cellpinda-gaba-daily-status-${{ github.run_id }}
          path: daily-status.json
          if-no-files-found: error
          retention-days: 30
      - name: Add report to run summary
        if: always()
        shell: bash
        run: |
          echo '## 셀핀다 GABA 일일 업무진행 보고' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat daily-status.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Update rolling report issue
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REPORT_PATH: daily-status.json
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, 'utf8'));
            const title = '[자동 보고] 셀핀다 GABA 업무 진행상황';
            const counts = report.taskCounts || {};
            const gates = (report.nextActions || []).map(item => {
              const blockers = Array.isArray(item.blockers) && item.blockers.length
                ? `\n  - ${item.blockers.join('\n  - ')}`
                : '';
              return `- **${item.id}** · ${item.status} · ${item.detail || ''}${blockers}`;
            }).join('\n');
            const body = [
              `## ${title}`,
              '',
              `- 보고 시각: ${report.reportedAtKst || report.generatedAt} (한국 시간)`,
              `- 실행 시각(UTC): ${report.generatedAt}`,
              `- 목표: ${report.goalId || '확인 필요'}`,
              `- 목표 상태: **${report.overallStatus}**`,
              `- 핵심 검증: **${report.coreValid ? 'MET' : '확인 필요'}**`,
              `- 작업 현황: DONE ${counts.DONE || 0} · VERIFYING ${counts.VERIFYING || 0} · WAITING ${counts.WAITING || 0} · FAILED ${counts.FAILED || 0}`,
              `- 공개 사이트: **${report.live?.status || 'UNKNOWN'}** · HTTP ${report.live?.page ?? '확인 필요'} · 제품 ${report.live?.products ?? '확인 필요'}개 · 750 제거 ${report.live?.removed750 === true ? '확인' : '확인 필요'}`,
              '',
              '### 다음 확인 항목',
              gates || '- 현재 추가 입력 대기 항목 없음',
              '',
              '이 보고서는 상태를 읽어 기록한 것입니다. 제품 표시·광고·후기 권한·주문·외부 게시 상태는 자동 변경하지 않습니다.',
              '',
              `실행: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
              core.info(`Updated rolling report issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
              core.info(`Created rolling report issue #${created.data.number}`);
            }
      - name: Fail when monitored checks fail
        if: steps.report.outcome == 'failure'
        run: exit 1
