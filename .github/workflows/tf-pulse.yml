name: TF decision pulse

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tf-pulse
  cancel-in-progress: true

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Validate TF decision contract
        run: node scripts/validate-tf-pulse.mjs
      - name: Generate TF decision pulse
        run: node scripts/tf-pulse.mjs --json > tf-pulse.json
      - name: Persist safe pulse heartbeat
        run: |
          node scripts/write-tf-pulse-heartbeat.mjs tf-pulse.json
          git config user.name "cellpinda-tf-pulse[bot]"
          git config user.email "cellpinda-tf-pulse[bot]@users.noreply.github.com"
          git add data/tf-pulse-heartbeat.json
          if git diff --cached --quiet; then
            echo "Pulse heartbeat unchanged."
          else
            git commit -m "chore: refresh TF pulse heartbeat"
            git push origin HEAD:main
            gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Add pulse to run summary
        run: |
          {
            echo '## TF decision pulse'
            echo
            echo '```json'
            cat tf-pulse.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload pulse artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tf-pulse-${{ github.run_id }}
          path: tf-pulse.json
          if-no-files-found: error
          retention-days: 14
