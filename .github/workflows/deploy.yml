name: Verify and deploy Cellpinda GABA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install pinned package manager
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Sync approved public data
        run: pnpm run sync:data
      - name: Validate active Goal Contract
        run: pnpm run validate:goal
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test rules and API boundaries
        run: pnpm test
      - name: Build deployment bundle
        run: pnpm run build
      - name: Build GitHub Pages bundle
        env:
          VITE_BASE_PATH: /cellpinda_GABA/
        run: |
          pnpm exec vite build --base "$VITE_BASE_PATH" --outDir dist-pages
          cp dist-pages/index.html dist-pages/404.html
      - name: Verify review publishing with isolated local D1
        run: pnpm run test:worker-reviews
      - name: Bundle Worker without deploying
        run: pnpm exec wrangler deploy --dry-run --outdir worker-build
      - name: Upload build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cellpinda-gaba-${{ github.sha }}
          path: |
            dist/
            worker-build/
          if-no-files-found: error
          retention-days: 7
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy-pages:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish static site
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-worker:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_ENABLED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.CLOUDFLARE_D1_DATABASE_ID != '' && secrets.ADMIN_TOKEN != '' && secrets.MEMBER_ORIGIN != '' }}
    steps:
      - name: Report deployment configuration
        run: |
          if [ "$DEPLOY_ENABLED" != "true" ]; then
            echo "Cloudflare deployment skipped: repository secrets are not configured."
            echo "Set CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_D1_DATABASE_ID, ADMIN_TOKEN and MEMBER_ORIGIN to enable automatic deploys."
          else
            echo "Cloudflare deployment secrets are configured."
          fi
      - name: Check out source
        if: env.DEPLOY_ENABLED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        if: env.DEPLOY_ENABLED == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install pinned package manager
        if: env.DEPLOY_ENABLED == 'true'
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        if: env.DEPLOY_ENABLED == 'true'
        run: pnpm install --frozen-lockfile
      - name: Sync approved public data and build
        if: env.DEPLOY_ENABLED == 'true'
        run: pnpm run build
      - name: Create deployment Wrangler config
        if: env.DEPLOY_ENABLED == 'true'
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: node -e "const fs=require('node:fs');const config=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));config.account_id=process.env.ACCOUNT_ID;config.d1_databases[0].database_id=process.env.DATABASE_ID;fs.writeFileSync('wrangler.deploy.jsonc',JSON.stringify(config,null,2));"
      - name: Upload runtime secrets
        if: env.DEPLOY_ENABLED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          MEMBER_ORIGIN: ${{ secrets.MEMBER_ORIGIN }}
        run: |
          printf '%s' "$ADMIN_TOKEN" | pnpm exec wrangler secret put ADMIN_TOKEN --config wrangler.deploy.jsonc
          printf '%s' "$MEMBER_ORIGIN" | pnpm exec wrangler secret put MEMBER_ORIGIN --config wrangler.deploy.jsonc
      - name: Deploy Worker, D1 and assets
        if: env.DEPLOY_ENABLED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy --config wrangler.deploy.jsonc
