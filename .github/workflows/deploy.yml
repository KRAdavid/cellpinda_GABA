name: Verify and deploy Cellpinda GABA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Test history privacy pattern coverage
        run: node --test scripts/audit-history-privacy.test.mjs
      - name: Review reachable Git history for local-path exposure
        run: node scripts/audit-history-privacy.mjs
      - name: Install pinned package manager
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Sync approved public data
        run: pnpm run sync:data
      - name: Validate active Goal Contract
        run: pnpm run validate:goal
      - name: Validate consumer research copy
        run: pnpm run validate:research-copy
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test rules and API boundaries
        run: pnpm test
      - name: Build deployment bundle
        run: pnpm run build
      - name: Check deployment readiness
        run: pnpm run preflight:deploy
      - name: Audit active Goal Contract and gates
        run: node scripts/audit-goal.mjs --json | tee goal-audit.json
      - name: Build GitHub Pages bundle
        env:
          VITE_BASE_PATH: /cellpinda_GABA/
          VITE_KAKAO_JS_KEY: ${{ vars.KAKAO_JS_KEY }}
          PUBLIC_SITE_URL: https://kradavid.github.io/cellpinda_GABA
          RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RELEASE_RUNTIME_MODE: static
        run: |
          pnpm exec vite build --base "$VITE_BASE_PATH" --outDir dist-pages
          node scripts/rewrite-public-origin.mjs dist-pages
          pnpm run generate:release-manifest -- dist-pages
          pnpm run validate:release-manifest -- dist-pages
          node scripts/check-public-artifacts.mjs dist-pages
          pnpm run validate:static-bundle -- dist-pages
          pnpm run validate:performance -- dist-pages
      - name: Verify review publishing with isolated local D1
        run: pnpm run test:worker-reviews
      - name: Bundle Worker without deploying
        run: pnpm exec wrangler deploy --dry-run --outdir worker-build
      - name: Upload build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cellpinda-gaba-${{ github.sha }}
          path: |
            dist/
            dist-pages/
            worker-build/
          if-no-files-found: error
          retention-days: 7
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-pages

  deploy-pages:
    needs: [release-verify, worker-readiness, deploy-worker]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.release-verify.result == 'success' && needs.worker-readiness.result == 'success' && (needs.worker-readiness.outputs.enabled != 'true' || needs.deploy-worker.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish static site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke-live:
    needs: [deploy-pages, worker-readiness, deploy-worker]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.deploy-pages.result == 'success' && needs.worker-readiness.result == 'success' && (needs.worker-readiness.outputs.enabled != 'true' || needs.deploy-worker.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Verify live public export
        env:
          PAGES_PUBLIC_SITE_URL: https://kradavid.github.io/cellpinda_GABA
          WORKER_PUBLIC_SITE_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          WORKER_ENABLED: ${{ needs.worker-readiness.outputs.enabled }}
          WORKER_RESULT: ${{ needs.deploy-worker.result }}
        run: |
          if [ "$WORKER_ENABLED" = "true" ] && [ "$WORKER_RESULT" = "success" ]; then
            PUBLIC_SITE_URL="$WORKER_PUBLIC_SITE_URL" PUBLIC_RUNTIME_MODE=worker node scripts/validate-live-public.mjs
          else
            PUBLIC_SITE_URL="$PAGES_PUBLIC_SITE_URL" PUBLIC_RUNTIME_MODE=static node scripts/validate-live-public.mjs
          fi

  worker-readiness:
    needs: release-verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - name: Evaluate Worker deployment gate
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          MEMBER_ORIGIN: ${{ secrets.MEMBER_ORIGIN }}
          CLOUDFLARE_WORKER_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
        run: |
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_D1_DATABASE_ID ADMIN_TOKEN MEMBER_ORIGIN; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ -z "$CLOUDFLARE_WORKER_URL" ]; then missing+=("CLOUDFLARE_WORKER_URL repository variable"); fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Cloudflare Worker/API"
              echo "**HOLD — Worker/D1 deployment was not run.**"
              echo "Missing repository secrets: ${missing[*]}"
              echo "GitHub Pages remains the current public runtime until these secrets and the production origin are configured."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "## Cloudflare Worker/API" >> "$GITHUB_STEP_SUMMARY"
            echo "All required deployment secrets are present; the Worker deployment gate is open." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy-worker:
    needs: [release-verify, worker-readiness]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.worker-readiness.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEPLOY_ENABLED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.CLOUDFLARE_D1_DATABASE_ID != '' && secrets.ADMIN_TOKEN != '' && secrets.MEMBER_ORIGIN != '' }}
    steps:
      - name: Check out source
        if: env.DEPLOY_ENABLED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        if: env.DEPLOY_ENABLED == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install pinned package manager
        if: env.DEPLOY_ENABLED == 'true'
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        if: env.DEPLOY_ENABLED == 'true'
        run: pnpm install --frozen-lockfile
      - name: Sync approved public data and build
        if: env.DEPLOY_ENABLED == 'true'
        env:
          VITE_KAKAO_JS_KEY: ${{ vars.KAKAO_JS_KEY }}
          PUBLIC_SITE_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RELEASE_RUNTIME_MODE: worker
        run: pnpm run build
      - name: Strict deployment readiness gate
        if: env.DEPLOY_ENABLED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          MEMBER_ORIGIN: ${{ secrets.MEMBER_ORIGIN }}
          PUBLIC_SITE_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
        run: pnpm run preflight:deploy -- --strict
      - name: Create deployment Wrangler config
        if: env.DEPLOY_ENABLED == 'true'
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          PUBLIC_SITE_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
        run: node -e "const fs=require('node:fs');const config=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));config.account_id=process.env.ACCOUNT_ID;config.d1_databases[0].database_id=process.env.DATABASE_ID;config.vars={...(config.vars||{}),PUBLIC_SITE_URL:process.env.PUBLIC_SITE_URL};fs.writeFileSync('wrangler.deploy.jsonc',JSON.stringify(config,null,2));"
      - name: Upload runtime secrets
        if: env.DEPLOY_ENABLED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ADMIN_ROLE_TOKENS: ${{ secrets.ADMIN_ROLE_TOKENS }}
          MEMBER_ORIGIN: ${{ secrets.MEMBER_ORIGIN }}
        run: |
          printf '%s' "$ADMIN_TOKEN" | pnpm exec wrangler secret put ADMIN_TOKEN --config wrangler.deploy.jsonc
          if [ -n "$ADMIN_ROLE_TOKENS" ]; then printf '%s' "$ADMIN_ROLE_TOKENS" | pnpm exec wrangler secret put ADMIN_ROLE_TOKENS --config wrangler.deploy.jsonc; fi
          printf '%s' "$MEMBER_ORIGIN" | pnpm exec wrangler secret put MEMBER_ORIGIN --config wrangler.deploy.jsonc
      - name: Deploy Worker, D1 and assets
        if: env.DEPLOY_ENABLED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy --config wrangler.deploy.jsonc
      - name: Verify deployed Worker API and security headers
        if: env.DEPLOY_ENABLED == 'true'
        env:
          WORKER_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
          MEMBER_ORIGIN: ${{ secrets.MEMBER_ORIGIN }}
        run: node scripts/validate-worker-live.mjs

  release-status:
    needs: [deploy-pages, smoke-live, worker-readiness, deploy-worker]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Publish release mode
        id: status
        env:
          PAGES_RESULT: ${{ needs.deploy-pages.result }}
          SMOKE_RESULT: ${{ needs.smoke-live.result }}
          WORKER_RESULT: ${{ needs.deploy-worker.result }}
          WORKER_READINESS_RESULT: ${{ needs.worker-readiness.result }}
          WORKER_ENABLED: ${{ needs.worker-readiness.outputs.enabled }}
        run: |
          if [ "$PAGES_RESULT" != "success" ] || [ "$SMOKE_RESULT" != "success" ] || [ "$WORKER_READINESS_RESULT" != "success" ]; then
            mode="RELEASE_FAILED"
          elif [ "$WORKER_ENABLED" = "true" ] && [ "$WORKER_RESULT" != "success" ]; then
            mode="RELEASE_FAILED"
          elif [ "$WORKER_ENABLED" = "true" ] && [ "$WORKER_RESULT" = "success" ]; then
            mode="FULL_RELEASE"
          else
            mode="STATIC_ONLY"
          fi

          export RELEASE_MODE="$mode"
          node - <<'NODE'
          const fs = require('node:fs');
          const value = {
            checkedAt: new Date().toISOString(),
            mode: process.env.RELEASE_MODE,
            pages: process.env.PAGES_RESULT,
            smoke: process.env.SMOKE_RESULT,
            workerReadinessResult: process.env.WORKER_READINESS_RESULT,
            workerReadiness: process.env.WORKER_ENABLED === 'true',
            workerDeployment: process.env.WORKER_RESULT,
          };
          fs.writeFileSync('release-status.json', `${JSON.stringify(value, null, 2)}\n`);
          NODE
          pnpm run validate:release-status -- release-status.json
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

          {
            echo "## Release mode"
            echo "**$mode**"
            echo "- GitHub Pages: $PAGES_RESULT"
            echo "- Public smoke check: $SMOKE_RESULT"
            echo "- Worker/D1 readiness job: ${WORKER_READINESS_RESULT:-unknown}"
            echo "- Worker/D1 readiness gate: ${WORKER_ENABLED:-false}"
            echo "- Worker/D1 deployment: $WORKER_RESULT"
            if [ "$mode" = "STATIC_ONLY" ]; then
              echo "- Worker/D1 remains HOLD; this run publishes the static public site only."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$mode" = "RELEASE_FAILED" ]; then
            exit 1
          fi
      - name: Upload release status packet
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cellpinda-gaba-release-status-${{ github.run_id }}
          path: release-status.json
          if-no-files-found: error
          retention-days: 30
