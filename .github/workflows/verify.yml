name: Verify consumer site

on:
  push:
    branches: [codex/consumer-site]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install pinned package manager
        run: npm install --global pnpm@11.19.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check frontend and Worker types
        run: pnpm run typecheck
      - name: Test application rules and API boundaries
        run: pnpm test
      - name: Build frontend
        run: pnpm run build
      - name: Verify review publishing with isolated local D1
        run: pnpm run test:worker-reviews
      - name: Bundle Worker without deploying
        run: pnpm exec wrangler deploy --dry-run --outdir worker-build
      - name: Retain build for inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cellpinda-build-${{ github.sha }}
          path: |
            dist/
            worker-build/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
